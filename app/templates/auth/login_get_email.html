{{ define "content" }}
<form hx-post="/login" hx-swap="outerHTML" hx-trigger="submit">
    <h1>Log In</h1>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    {{ if .error }}
        <pre style="color: red;">{{ .error }}</pre>
    {{ end }}

    <input type="submit">
</form>
{{ end }}

{{ define "content" }}
<div class="row" style="max-width: 500px; margin: 4rem auto;">
    <div class="twelve columns">
        <form hx-post="/login" hx-swap="outerHTML" hx-trigger="submit">
            <h3 style="text-align: center; margin-bottom: 2rem;">Sign In</h3>
            
            <div class="row">
                <div class="twelve columns">
                    <label for="email">Email</label>
                    <input class="u-full-width" 
                           type="email" 
                           id="email" 
                           name="email" 
                           required
                           placeholder="Enter your email">
                </div>
            </div>

            {{ if .error }}
            <div class="row">
                <div class="twelve columns" style="color: #dc2626; margin: 1rem 0;">
                    {{ .error }}
                </div>
            </div>
            {{ end }}

            <div class="row">
                <div class="twelve columns">
                    <button class="button-primary u-full-width" 
                            type="submit"
                            style="margin-top: 1rem;">
                        Continue
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{{ end }}

<div class="row" style="max-width: 500px; margin: 4rem auto;">
    <div class="twelve columns">
        <form hx-post="/authenticate" hx-swap="outerHTML" hx-trigger="submit">
            <h3 style="text-align: center; margin-bottom: 2rem;">Enter Verification Code</h3>
            
            <div class="row">
                <div class="twelve columns">
                    <label for="email">Email</label>
                    <input class="u-full-width" 
                           type="text" 
                           id="email" 
                           name="email" 
                           value="{{.email}}" 
                           readonly
                           style="background: #f9fafb;">
                </div>
            </div>

            <div class="row">
                <div class="twelve columns">
                    <label for="code">Verification Code</label>
                    <input type="text" 
                           name="code"
                           maxlength="6" 
                           pattern="[0-9]{6}" 
                           inputmode="numeric" 
                           required
                           autofocus
                           placeholder="• • • • • •"
                           class="u-full-width"
                           style="font-size: 2rem;
                                  letter-spacing: 0.5rem;
                                  text-align: center;
                                  background: #f9fafb;">
                </div>
            </div>

            {{ if .error }}
            <div class="row">
                <div class="twelve columns" style="color: #dc2626; margin: 1rem 0;">
                    {{ .error }}
                </div>
            </div>
            {{ end }}

            <div class="row">
                <div class="twelve columns">
                    <button class="button-primary u-full-width" 
                            type="submit"
                            style="margin-top: 1rem;">
                        Verify & Login
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

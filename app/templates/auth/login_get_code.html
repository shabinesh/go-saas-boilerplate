<form hx-post="/authenticate" hx-swap="outerHTML" hx-trigger="submit">
    <h3>A code is sent to your email</h3>
    <label for="email">Email:</label>
    <input type="text" id="email" name="email" {{ if .email }} value="{{.email}}" {{ end }} readonly>

    <br>
    <label for="code">OTP</label>
    <input type="text" id="code" name="code" required>
    {{ if .error }}
        <pre style="color: red;">{{ .error }}</pre>
    {{ end }}
    <br>
    <input type="submit">
</form>


    <form hx-post="/verify-otp" hx-swap="outerHTML" hx-trigger="submit">

        <input type="hidden" name="user_id" value="{{.user_id}}">
        <input type="hidden" name="reason" value="{{.reason}}">

        <div style="text-align: center; margin: 2rem auto; max-width: 400px;">
            <div style="margin-bottom: 1.5rem;">
                <h3 style="margin-bottom: 1rem;">Enter Verification Code</h3>
                <p style="color: #666; font-size: 0.9rem;">Please enter the 6-digit code sent to your email</p>
            </div>
            
            <div style="margin: 2rem 0">
                <input type="text" 
                       name="code"
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric" 
                       required
                       autofocus
                       placeholder="• • • • • •"
                       style="width: 80%; 
                              padding: 1rem;
                              font-size: 2rem;
                              letter-spacing: 0.5rem;
                              text-align: center;
                              border: 2px solid #e0e0e0;
                              border-radius: 8px;
                              outline: none;
                              background: #f9fafb;">
            </div>
            {{- if .message }}
                <div style="margin-bottom: 1rem; color: #dc2626;">{{ .message }}</div>
            {{ end -}}

            <button type="submit" 
                    style="width: 80%;
                           padding: 1rem;
                           background: #2563eb;
                           color: white;
                           font-size: 1.1rem;
                           font-weight: 500;
                           border: none;
                           border-radius: 8px;
                           cursor: pointer;
                           transition: background 0.2s;">
                Verify Code
            </button>
        </div>
    </form>
